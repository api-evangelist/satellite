name: Satellite
description: >-
  Satellite IM builds privacy-focused, decentralized peer-to-peer communication
  software for crypto and web3 communities. Its core is Warp, a Rust
  interface-driven distributed data service providing end-to-end-encrypted chat,
  voice, video, and file sharing with data stored on IPFS. Uplink is a
  customizable decentralized chat application built on top of Warp. Satellite
  publishes no hosted REST or GraphQL API; the developer surface is the
  open-source Warp Rust crates and the first-party warp-wasm WebAssembly and
  TypeScript library. Satellite is backed by Multicoin Capital and its code is
  MIT licensed.
